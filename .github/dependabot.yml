# Weekly uv.lock updates, each a PR that CI tests. harbor, which pier builds
# on most directly, gets PRs of its own so a break is attributable; the rest
# are grouped.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Every package in uv.lock, not only the direct ones (Dependabot's default).
    allow:
      - dependency-type: "all"
    groups:
      everything-but-harbor:
        patterns: ["*"]
        exclude-patterns: ["harbor"]
